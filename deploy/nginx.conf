worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_time=$request_time';

    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    large_client_header_buffers 4 16k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's embedded DNS keeps the upstream current after an app recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # A small edge guard for Better Auth sign-in endpoints. Empty keys are not
    # accounted, so other routes are unaffected.
    map $uri $login_limit_key {
        default                              '';
        ~^/api/auth/sign-in(?:/|$)           $binary_remote_addr;
    }

    map $uri $whatsapp_intent_limit_key {
        default                              '';
        /api/whatsapp/intents                $binary_remote_addr;
    }

    limit_req_zone $login_limit_key zone=login_per_ip:10m rate=20r/m;
    limit_req_zone $whatsapp_intent_limit_key zone=whatsapp_intent_per_ip:10m rate=1r/m;
    limit_req_status 429;

    upstream ti_shop_app {
        zone ti_shop_app 64k;
        server app:3000 resolve;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=login_per_ip burst=10 nodelay;
            limit_req zone=whatsapp_intent_per_ip burst=11 nodelay;

            proxy_http_version 1.1;
            proxy_pass http://ti_shop_app;
            proxy_redirect off;
            proxy_request_buffering on;

            # App Router responses may stream. Do not buffer them at nginx.
            proxy_buffering off;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Never trust or append client-supplied forwarding headers. The app
            # may trust X-Ti-Shop-Client-IP only because this proxy overwrites it
            # and the app service has no host-published port.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Ti-Shop-Client-IP $remote_addr;
            proxy_set_header X-Original-Forwarded-For "";

            # Defense in depth for historical middleware bypass headers.
            proxy_set_header X-Middleware-Subrequest "";
        }
    }
}
